name: InterMED

options:
  bundleIdPrefix: com.mujadarah.intermed
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  InterMEDCore:
    path: .

targets:
  InterMED:
    type: application
    platform: iOS
    sources:
      - path: apps/ios/InterMEDApp
    dependencies:
      - package: InterMEDCore
        product: InterMEDApplication
      - package: InterMEDCore
        product: InterMEDDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mujadarah.intermed
        PRODUCT_NAME: InterMED
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: InterMED
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1"

  InterMEDUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: apps/ios/InterMEDUITests
    dependencies:
      - target: InterMED
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mujadarah.intermed.uitests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  InterMED:
    build:
      targets:
        InterMED: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InterMEDUITests
    archive:
      config: Release
