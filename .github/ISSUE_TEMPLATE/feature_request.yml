name: Feature request
description: Propose a product or engineering improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the clinical or engineering problem, not only a preferred implementation. Do not include real or identifiable patient data.
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I confirm this request contains no real or identifiable patient data.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: safety-impact
    attributes:
      label: Clinical safety, privacy, or evidence impact
      description: Explain any clinical content, patient-data, AI, medication, or evidence implications.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
