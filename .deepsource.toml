version = 1

test_patterns = ["**/*.test.ts", "**/*.test.tsx", "tests/**"]
exclude_patterns = ["node_modules/**", "**/dist/**", "artifacts/**", ".tools/**", "test-results/**", "playwright-report/**"]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  environment = ["nodejs", "browser", "vitest"]
